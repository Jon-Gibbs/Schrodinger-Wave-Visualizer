          "type": "stat"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 27,
      "style": "dark",
      "tags": ["schrodinger"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Schrödinger Wave Equation - Metrics",
      "uid": "schrodinger-metrics",
      "version": 1
    }

---
# Service: Expose Grafana to external access
# NodePort allows access from your Mac browser
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: default
  labels:
    app: grafana
spec:
  type: NodePort               # External access on a node port
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000                 # Internal service port
    targetPort: http           # Pod port
    nodePort: 30000            # External port on EC2 node (access from browser)
    protocol: TCP
