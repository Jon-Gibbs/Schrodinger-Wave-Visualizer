---
# Grafana Deployment
# Visualization tool that queries Prometheus and displays dashboards
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472  # Kubernetes automatically sets volume group ownership to this GID

      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: IfNotPresent
        
        # Port where Grafana dashboard is accessible
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        
        # Environment variables for Grafana configuration
        env:
        # Admin credentials (change these in production!)
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        
        # Disable login (for lab environment, not production!)
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        
        # Install plugins
        - name: GF_INSTALL_PLUGINS
          value: ""
        
        # Provisioning paths
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        
        # Resource limits
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        
        # Health check
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60      # Increased from 30 to 60 (Grafana needs more time)
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30      # Increased from 10 to 30 (give Grafana time to start)
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Mount volumes
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana          # Grafana database and plugins
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: grafana-dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
      
      volumes:
      # Storage for Grafana database
      - name: grafana-storage
        emptyDir: {}
      
      # ConfigMap: Data source definition (Prometheus)
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      
      # ConfigMap: Dashboard provider (tells Grafana where to find dashboards)
      - name: grafana-dashboards-provider
        configMap:
          name: grafana-dashboards-provider
      
      # ConfigMap: Pre-built dashboards
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards

---
# ConfigMap: Data Source Configuration
# Tells Grafana how to connect to Prometheus
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    # Data source: Prometheus
    - name: Prometheus
      type: prometheus
      access: proxy                          # Grafana proxies requests to Prometheus
      url: http://prometheus-service:9090    # Internal service name and port
      isDefault: true                        # Use this by default
      editable: true
      jsonData:
        timeInterval: 15s                    # Scrape interval from Prometheus config

---
# ConfigMap: Dashboard Provider
# Tells Grafana to load dashboards from the dashboards ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: default
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: 'Schrodinger'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards

---
# ConfigMap: Pre-built Dashboards
# This dashboard shows CPU and memory usage during job execution
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: default
data:
  schrodinger-metrics.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "kubelet_running_pods",
              "refId": "A"
            }
          ],
