---
# Prometheus ConfigMap: Configuration for metric scraping
# This file defines how Prometheus discovers and scrapes metrics from the cluster
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    # Global settings for all scrape jobs
    global:
      scrape_interval: 15s       # Scrape metrics every 15 seconds
      evaluation_interval: 15s    # Evaluate rules every 15 seconds
      external_labels:
        cluster: 'schrodinger'
        environment: 'production'

    # Alerting configuration (optional)
    alerting:
      alertmanagers:
      - static_configs:
        - targets: []

    # Scrape configurations: Define what to monitor
    scrape_configs:
    
    # =====================================================================
    # Job 1: Kubernetes API Server
    # Scrapes metrics from the Kubernetes API server itself
    # =====================================================================
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

    # =====================================================================
    # Job 2: Kubernetes Nodes (kubelet)
    # Scrapes CPU, memory, disk, network metrics for each node
    # This is where we get pod-level resource usage during job execution
    # =====================================================================
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - source_labels: [__meta_kubernetes_node_address_InternalIP]
        target_label: __address__
        replacement: $1:10250
      - action: replace
        source_labels: [__meta_kubernetes_node_name]
        target_label: node

    # =====================================================================
    # Job 3: Kubernetes Pods
    # Discovers all pods in the cluster and scrapes their metrics
    # This captures metrics from worker pods during job execution
    # =====================================================================
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      # Only scrape pods that have the annotation "prometheus.io/scrape=true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: 'true'
      # Get the scrape path from annotation (default: /metrics)
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # Get the scrape port from annotation
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # Add pod name as label
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

    # =====================================================================
    # Job 4: Kubernetes Services
    # Discovers Kubernetes services and scrapes their endpoints
    # =====================================================================
    - job_name: 'kubernetes-services'
      kubernetes_sd_configs:
      - role: service
      metrics_path: /probe
      params:
        module: [http_2xx]
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe]
        action: keep
        regex: 'true'
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        target_label: instance
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: kubernetes_name

    # =====================================================================
    # Job 5: Prometheus itself
    # Self-monitoring: Prometheus scrapes its own metrics
    # =====================================================================
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']
