apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: schrodinger-pvc
  namespace: default
spec:
  # Access modes must be compatible with the PV
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  # Request 10Gi (less than the 80Gi available in the PV)
  resources:
    requests:
      storage: 10Gi
  
  # Optional: Selector to bind to specific PV by label
  # If omitted, Kubernetes will auto-bind to a matching PV
  # selector:
  #   matchLabels:
  #     pv-name: schrodinger-pv
