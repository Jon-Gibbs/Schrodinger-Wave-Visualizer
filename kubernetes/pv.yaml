apiVersion: v1
kind: PersistentVolume
metadata:
  name: schrodinger-pv
spec:
  # Storage capacity
  capacity:
    storage: 80Gi
  
  # Access modes define how the volume can be mounted
  # ReadWriteOnce - can be mounted by one pod at a time (good for EBS)
  accessModes:
    - ReadWriteOnce
  
  storageClassName: ""
  # AWS EBS volume - update volumeID with your actual EBS volume ID
  awsElasticBlockStore:
    volumeID: vol-003a6b9af62c56a19
    fsType: ext4
  
  # Pod eviction policy
  persistentVolumeReclaimPolicy: Retain
