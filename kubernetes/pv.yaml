apiVersion: v1
kind: PersistentVolume
metadata:
  name: schrodinger-pv
spec:
  # Storage capacity
  capacity:
    storage: 20Gi
  
  # Access modes define how the volume can be mounted
  # ReadWriteOnce - can be mounted by one pod at a time (good for EBS)
  accessModes:
    - ReadWriteOnce
  
  # StorageClass for dynamic provisioning (EBS on AWS)
  storageClassName: gp2
  
  # AWS EBS volume - update volumeID with your actual EBS volume ID
  awsElasticBlockStore:
    volumeID: vol-xxxxxxxxx  # Replace with your EBS volume ID
    fsType: ext4
  
  # Pod eviction policy
  persistentVolumeReclaimPolicy: Retain
